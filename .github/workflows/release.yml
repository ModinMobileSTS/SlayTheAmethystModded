name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret in environment release-signing." >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/release-signing.jks"
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "RELEASE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Download and verify private build dependency bundle
        shell: bash
        env:
          BUILD_DEPS_REPO: ${{ vars.BUILD_DEPS_REPO }}
          BUILD_DEPS_RELEASE_TAG: ${{ vars.BUILD_DEPS_RELEASE_TAG }}
          BUILD_DEPS_ASSET_NAME: ${{ vars.BUILD_DEPS_ASSET_NAME }}
          BUILD_DEPS_SHA256: ${{ vars.BUILD_DEPS_SHA256 }}
          GH_TOKEN: ${{ secrets.BUILD_DEPS_GH_TOKEN || github.token }}
          GH_REPO_CURRENT: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_DEPS_RELEASE_TAG:-}" ]; then
            echo "Missing environment variable BUILD_DEPS_RELEASE_TAG." >&2
            exit 1
          fi
          if [ -z "${BUILD_DEPS_SHA256:-}" ]; then
            echo "Missing environment variable BUILD_DEPS_SHA256." >&2
            exit 1
          fi

          deps_repo="${BUILD_DEPS_REPO:-$GH_REPO_CURRENT}"
          asset_name="${BUILD_DEPS_ASSET_NAME:-build-deps.tar.gz}"
          archive_path="$RUNNER_TEMP/$asset_name"

          gh release download "$BUILD_DEPS_RELEASE_TAG" \
            --repo "$deps_repo" \
            --pattern "$asset_name" \
            --dir "$RUNNER_TEMP" \
            --clobber

          echo "$BUILD_DEPS_SHA256  $archive_path" | sha256sum --check --status

          deps_root="$RUNNER_TEMP/build-deps"
          mkdir -p "$deps_root"
          tar -xzf "$archive_path" -C "$deps_root"
          if [ -d "$deps_root/build-deps" ]; then
            deps_root="$deps_root/build-deps"
          fi

          # Accept both the canonical flat layout and the legacy nested one, then
          # normalize into the single layout the build expects.
          resolve_dep() {
            local canonical="$1"
            shift
            local candidate
            for candidate in "$@"; do
              if [ -f "$deps_root/$candidate" ]; then
                printf '%s\n' "$deps_root/$candidate"
                return 0
              fi
            done
            echo "Missing ${canonical} in dependency bundle (looked for: $*)" >&2
            return 1
          }

          desktop_jar="$(resolve_dep 'build-deps/desktop.jar' \
            'desktop.jar' 'steamapps/common/SlayTheSpire/desktop-1.0.jar')"
          runtime_zip="$(resolve_dep 'build-deps/jre8-pojav.zip' \
            'jre8-pojav.zip' 'runtime-pack/jre8-pojav.zip')"

          mkdir -p build-deps
          cp "$desktop_jar" build-deps/desktop.jar
          cp "$runtime_zip" build-deps/jre8-pojav.zip

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build signed release APKs
        env:
          RELEASE_STORE_FILE: ${{ env.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" :app:assembleRelease --stacktrace
          ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" :app:assembleFullRelease --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SlayTheAmethyst-${{ github.ref_name }}-release-apks
          path: |
            app/build/outputs/apk/release/SlayTheAmethyst-release-*.apk
            app/build/outputs/apk/fullRelease/SlayTheAmethyst-release-*-full.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          notes_file="docs/release/note/${tag}.md"
          shopt -s nullglob
          assets=(
            app/build/outputs/apk/release/SlayTheAmethyst-release-*.apk
            app/build/outputs/apk/fullRelease/SlayTheAmethyst-release-*-full.apk
          )
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "Expected exactly 2 APK assets for release publish, found ${#assets[@]}." >&2
            printf 'Matched assets:\n' >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            if [ -f "$notes_file" ]; then
              gh release edit "$tag" --title "$tag" --notes-file "$notes_file"
            fi
          else
            if [ -f "$notes_file" ]; then
              gh release create "$tag" "${assets[@]}" --title "$tag" --notes-file "$notes_file"
            else
              gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes
            fi
          fi
