name: Publish Online Service Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - online-service/**
      - docker-compose.yaml
      - .github/workflows/publish-online-service.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./online-service
          push: true
          tags: |
            ghcr.io/modinmobilests/slaytheamethyst-online-service:latest
            ghcr.io/modinmobilests/slaytheamethyst-online-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
