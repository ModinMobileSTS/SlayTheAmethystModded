// Wire-compatible subset of SteamDatabase/Protobufs' steammessages_auth.steamclient.proto.
// Only requests used by the standalone HTTPS login CLI are included.
// Regenerate: python -m grpc_tools.protoc -I . --python_out=. steam_auth.proto
syntax = "proto2";
package sts.login;

message GetPasswordRSAPublicKeyRequest {
  optional string account_name = 1;
}

message DeviceDetails {
  optional string device_friendly_name = 1;
  optional int32 platform_type = 2;
  optional int32 os_type = 3;
  optional uint32 gaming_device_type = 4;
}

message BeginAuthSessionViaCredentialsRequest {
  optional string device_friendly_name = 1;
  optional string account_name = 2;
  optional string encrypted_password = 3;
  optional uint64 encryption_timestamp = 4;
  optional bool remember_login = 5;
  optional int32 platform_type = 6;
  optional int32 persistence = 7;
  optional string website_id = 8;
  optional DeviceDetails device_details = 9;
}

message UpdateAuthSessionWithSteamGuardCodeRequest {
  optional uint64 client_id = 1;
  optional fixed64 steamid = 2;
  optional string code = 3;
  optional int32 code_type = 4;
}

message PollAuthSessionStatusRequest {
  optional uint64 client_id = 1;
  optional bytes request_id = 2;
}
