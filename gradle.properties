application.id=io.stamethyst
application.version.name=1.6.6-dev5
application.version.code=1
#-dev1
#-RC2
# Keep build-time headroom, but return unused heap after a quiet minute.
org.gradle.jvmargs=-Xms128m -Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000 -XX:G1PeriodicGCSystemLoadThreshold=0 -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -Dfile.encoding=UTF-8 -Dkotlin.daemon.options=autoshutdownIdleSeconds=600
org.gradle.daemon.idletimeout=600000
# Kotlin inherits the memory limits, not the GC settings, from Gradle.
kotlin.daemon.jvmargs=-Xms128m -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000 -XX:G1PeriodicGCSystemLoadThreshold=0 -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40
pythonExecutable=python3
org.gradle.workers.max=4
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Optional feedback relay secret used by the in-app feedback form.
# feedback.apiKey=
# Hosted resource pack identity. Independent of application.version.name.
# Do not bump these when shipping an app update unless the zip at the
# download URL actually changed; otherwise players would re-download.
resourcePack.version=resources-v1.7
# Optional SHA-256 of that hosted archive, not of a locally packaged zip.
resourcePack.sha256=f3f920a5971903f45e0d59043ded80392b1a322f544d419258338c102b5de6fc
