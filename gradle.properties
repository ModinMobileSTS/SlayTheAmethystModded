application.id=io.stamethyst
application.version.name=1.6.1-dev4
application.version.code=1

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
pythonExecutable=python3
org.gradle.workers.max=4
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Optional feedback relay secret used by the in-app feedback form.
# feedback.apiKey=
# Sling Break minigame source. By default the web bundle is fetched from the upstream
# repository archive on every packaging build and revalidated with the server's ETag /
# Last-Modified validators, so an unchanged upstream costs one request instead of a
# download. Pin another branch/tag/commit with slingBreak.ref (full refs/tags/... also
# works), point slingBreak.repository at a fork/mirror, or set slingBreak.sourceUrl to a
# complete archive URL. For offline builds set slingBreak.sourceDir to a local checkout.
# slingBreak.repository=https://github.com/Apricityx/slingbreak
# slingBreak.ref=master
# slingBreak.sourceUrl=
# slingBreak.sourceDir=
# Hosted resource pack identity. Independent of application.version.name.
# Do not bump these when shipping an app update unless the zip at the
# download URL actually changed; otherwise players would re-download.
resourcePack.version=resources-v1.6
# Optional SHA-256 of that hosted archive, not of a locally packaged zip.
# resourcePack.sha256=
