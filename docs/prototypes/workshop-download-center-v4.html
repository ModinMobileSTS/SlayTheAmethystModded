<div class="page"><header class="bar"><button class="iconbtn" id="nav" aria-label="返回模组市场"></button><div class="headtext"><h1 id="title">下载中心</h1></div><button class="iconbtn" data-a="appearance" aria-label="预览启动器外观" title="预览启动器外观"><svg class="icon" aria-hidden="true"><use href="#palette"/></svg></button></header>

<script>
'use strict';
const $=s=>document.querySelector(s),ic=(n,c='')=>`<svg class="icon ${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const button=(a,id,label,style,icon='',only=false)=>`<button data-a="${a}" ${id?`data-id="${id}"`:''} class="${style}" aria-label="${label}${id?' · '+find(id).name:''}" title="${label}">${icon?ic(icon):''}${only?'':label}</button>`;
const art={fall:'workshop-covers/downfall-hero.jpg',map:'workshop-covers/1611666859.jpg',path:'workshop-covers/1611047977.jpg'};
const seeds={无色:'#2196F3',战士:'#C24A4A',猎手:'#3F8A4B',故障机器人:'#D2A72E',观者:'#6F4C93'};
let theme='无色',mode='跟随系统',view='center',jobs=[],panel='',selected='',opener=null;
const prefersDark=matchMedia('(prefers-color-scheme:dark)'),root=document.documentElement;
function paint(){
 const dark=mode==='深色'||(mode==='跟随系统'&&prefersDark.matches),custom=theme!=='无色',seed=seeds[theme];
 root.dataset.dark=dark;const mix=(a,b,n)=>`color-mix(in srgb,${a} ${100-n}%,${b})`,base=dark?'#15121a':'#fff8fc',ink=dark?'#e9e0ea':'#1e1a20';
 const surf=mix(seed,base,dark?84:92),p=dark?mix(seed,'white',42):mix(seed,'black',10);
 const roles={bg:mix(seed,base,dark?88:95),surface:surf,ink:mix(ink,seed,dark?6:8),sub:mix(ink,seed,dark?22:24),p,onp:dark||theme==='故障机器人'?'#1e1a20':'white',tint:mix(seed,dark?base:'white',dark?36:78),ontint:mix(seed,dark?'white':ink,dark?80:68),secondary:mix(seed,dark?base:'white',dark?49:80),low:mix(surf,seed,dark?4:3),card:mix(surf,seed,dark?8:6),sheet:mix(surf,seed,dark?13:11),line:mix(seed,dark?'#968e9c':'#7c7483',62)};
 for(const [k,v] of Object.entries(roles)){if(custom)root.style.setProperty('--'+k,v);else root.style.removeProperty('--'+k)}
}
prefersDark.addEventListener('change',paint);
const seedJobs=[['fall','Downfall','大型扩展模组',200,128,'active'],['map','Colored Map','地图美化',12.4,0,'queued'],['path','Highlight Paths','辅助工具',8.6,0,'queued'],['lib','StSLib','基础依赖',6.8,0,'failed'],['base','BaseMod','基础依赖',14.2,14.2,'done']];
const labels={active:'正在下载',connecting:'正在连接',paused:'已暂停',queued:'等待下载',failed:'下载失败',done:'已完成',cancelled:'已取消'};
const find=id=>jobs.find(j=>j.id===id),current=()=>jobs.find(j=>['active','connecting','paused'].includes(j.state)),historyTask=j=>['done','cancelled'].includes(j.state),num=n=>String(Number(n.toFixed(1))),sound=s=>$('#live').textContent=s;
const fileCounts={fall:96,map:12,path:9,lib:18,base:24};
function sample(i){return [2.6+.55*Math.sin(i*.5)+.38*Math.cos(i*.81),2.84+.76*Math.sin(i*.32)+.36*Math.cos(i*.74)]}
function reset(){jobs=seedJobs.map(([id,name,kind,size,got,state])=>{
 const pairs=state==='active'?Array.from({length:36},(_,i)=>sample(i)):[];
 return {id,name,kind,size,got,state,files:fileCounts[id],written:state==='active'?114:got,
   series:pairs.map(x=>x[0]),diskSeries:pairs.map(x=>x[1]),peak:Math.max(0,...pairs.map(x=>x[0])),tick:pairs.length};
});$('#historyBox').open=false;draw()}
function start(j){Object.assign(j,{state:'connecting',got:0,written:0,series:[],diskSeries:[],peak:0,tick:0})}
function next(){if(!current()){const j=jobs.find(j=>j.state==='queued');if(j)start(j)}}
const artStyle=j=>art[j.id]?`style="background-image:url('${art[j.id]}')"`:'';
function feature(){
 const j=current(),el=$('#current');
 if(!j){el.innerHTML='<div class="empty"><h2>当前没有下载</h2><p>下载结果可以在历史记录中查看。</p></div>';return}
 const paused=j.state==='paused',conn=j.state==='connecting';
 const meter=(key,label,style)=>`<div><span class="meter-name"><i class="key ${style}"></i>${label}</span><span class="rate num"><span id="${key}"></span><small>MB/s</small></span></div>`;
 const rail=(key,label,style)=>`<div><div class="rail-label"><span>${label}</span><span class="num" id="${key}-value"></span></div><div class="track ${style}" role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" id="${key}"><i></i></div></div>`;
 el.innerHTML=`<article class="canvas ${art[j.id]?'':'no-art'}"><div class="artwork" aria-hidden="true" ${artStyle(j)}></div>
 <div class="hero-title"><button class="mod-link" data-a="info" data-id="${j.id}" aria-label="查看 ${j.name} 传输详情"><strong>${j.name}</strong><span>${j.kind} ${ic('down')}</span></button></div>
 <div class="telemetry"><div class="meters">${meter('network','网络速度','')}${meter('peak','网络峰值','peak')}${meter('disk','磁盘写入','disk')}</div>
 <svg class="spark" viewBox="0 0 360 36" preserveAspectRatio="none" role="img" aria-label="最近 36 秒，柱状为网络速度，折线为磁盘写入速度"><path class="guide" d="M0 12h360M0 24h360M0 35h360"/><g id="trace"></g></svg>
 ${conn?'<p class="conn">正在连接创意工坊…</p>':`<div class="rails">${rail('bytes','下载数据','')}${rail('files','写入文件','file-track')}</div>`}
 <div class="canvas-foot"><span class="timing num" id="reading"></span>${button(paused?'restart':'pause',j.id,paused?'重新开始':'暂停','pill filled',paused?'play':'pause')}</div></div></article>`;
 updateProgress()
}
function updateProgress(){
 const j=current();if(!j||!$('#trace'))return;const live=j.state==='active',net=live?(j.series.at(-1)||0):0,disk=live?(j.diskSeries.at(-1)||0):0;
 $('#network').textContent=net.toFixed(1);$('#peak').textContent=j.peak.toFixed(1);$('#disk').textContent=disk.toFixed(1);
 const hi=Math.max(4,j.peak,...j.diskSeries)*1.05,y=v=>36-v/hi*34,x=i=>(36-j.series.length+i)*10+4;
 $('#trace').innerHTML=j.series.map((v,i)=>`<rect class="bars" x="${x(i)-3}" y="${y(v)}" width="6" height="${36-y(v)}" rx="1"/>`).join('')+
 `<polyline class="line" points="${j.diskSeries.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`;
 if($('#bytes')){const files=Math.floor(j.written/j.size*j.files);
 for(const [id,pc,caption] of [['bytes',100*j.got/j.size,`${num(j.got)} / ${num(j.size)} MB`],['files',100*files/j.files,`${files} / ${j.files}`]]){
 $('#'+id+'-value').textContent=`${caption} · ${Math.floor(pc)}%`;$('#'+id).setAttribute('aria-valuenow',Math.floor(pc));$('#'+id+' i').style.width=`${pc}%`;
 }}
 const seconds=Math.ceil(Math.max((j.size-j.got)/Math.max(.1,net),(j.size-j.written)/Math.max(.1,disk)));
 $('#reading').textContent=j.state==='paused'?'已暂停 · 重新开始将从 0 下载':j.state==='connecting'?'等待传输':`预计剩余 ${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
}
function entry(j,i,market=false){
 const q=j.state==='queued',f=j.state==='failed',label=market?j.kind:q?`${num(j.size)} MB · ${j.kind}`:f?'连接超时':`${labels[j.state]} · ${num(j.size)} MB`;
 return `<div class="entry"><button class="rowbtn" data-a="info" data-id="${j.id}" aria-label="查看 ${j.name} 详情"><span class="thumb ${f?'fail':''}" ${artStyle(j)}>${art[j.id]?'':ic(historyTask(j)?'tick':'layers')}</span><span class="rowtxt"><strong>${j.name}</strong><small class="${!market&&f?'reason':''}">${label}</small></span></button>${market?'':q?i===0?'<span class="next">下一项</span>':button('first',j.id,'移到队首','iconbtn','first',true):f?button('retry',j.id,'重试','pill textbtn','retry'):''}</div>`;
}
function draw(){
 feature();const q=jobs.filter(j=>j.state==='queued'),e=jobs.filter(j=>j.state==='failed'),h=jobs.filter(historyTask);$('#qc').textContent=q.length;$('#queue').innerHTML=q.map((j,i)=>entry(j,i)).join('')||'<p class="empty">暂无排队任务</p>';$('#ec').textContent=e.length;$('#failedGroup').hidden=!e.length;$('#failed').innerHTML=e.map((j,i)=>entry(j,i)).join('');$('#hc').textContent=h.length;$('#past').innerHTML=h.map((j,i)=>entry(j,i)).join('');$('#historyBox').hidden=!h.length;
 $('#marketRows').innerHTML=jobs.slice(0,3).map(j=>entry(j,0,true)).join('');
 const center=view==='center';$('#center').hidden=!center;$('#market').hidden=center;$('#title').textContent=center?'下载中心':'模组市场';const nav=$('#nav');nav.dataset.a=center?'market':'center';nav.innerHTML=ic(center?'back':'download');nav.setAttribute('aria-label',center?'返回模组市场':'打开下载中心');
}
const copy={active:'正在从创意工坊接收文件。',connecting:'正在连接创意工坊。',queued:'当前任务完成后，按队列顺序开始下载。',paused:'重新开始会从 0 下载。',failed:'连接创意工坊超时。重试可将任务放回队尾。',done:'文件已下载完成。',cancelled:'任务已取消，可重新加入队列。'};
function graph(j){if(!j.series.length)return '';const pts=j.series.map((n,i)=>`${i*300/Math.max(1,j.series.length-1)},${50-n*11}`).join(' ');return `<div class="graphbox"><div class="sec-title"><strong>传输速度</strong><span class="sec-note">最近 ${j.series.length} 秒 · MB/s</span></div><svg viewBox="0 0 300 55" preserveAspectRatio="none" role="img" aria-label="传输速度曲线"><path d="M0 15h300M0 34h300M0 53h300" stroke="var(--line)" opacity=".5"/><polygon points="0,55 ${pts} 300,55" fill="currentColor" opacity=".1"/><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`}
function sheet(){
 const j=find(selected),head=`<div class="sheethead"><span>${panel==='appearance'?'原型预览':'下载中心'}</span>${button('close','','关闭','iconbtn','close',true)}</div>`;
 if(panel==='appearance'){$('#sheet').innerHTML=head+`<h2 id="dtitle">启动器外观</h2><p class="desc">预览下载中心在不同启动器主题下的样子。</p><span class="fieldname">主题色</span><div class="swatches">${Object.entries(seeds).map(([k,v])=>`<button data-a="theme" data-val="${k}" class="sw" aria-pressed="${theme===k}"><i style="background:${v}">${theme===k?ic('tick'):''}</i>${k}</button>`).join('')}</div><span class="fieldname">亮暗模式</span><div class="seg">${['跟随系统','浅色','深色'].map(k=>`<button data-a="mode" data-val="${k}" aria-pressed="${mode===k}">${k}</button>`).join('')}</div><div class="actions">${button('reset','','重置示例任务','pill textbtn')}${button('close','','完成','pill filled')}</div>`;return}
 if(!j)return;
 if(panel==='confirm'){$('#sheet').innerHTML=head+`<h2 id="dtitle">取消 ${j.name} 的下载？</h2><p class="desc">之后可以从历史记录中重新下载。</p><div class="actions">${button('infoBack',j.id,'保留任务','pill tonal')}${button('cancel',j.id,'取消下载','pill filled')}</div>`;return}
 const act=({active:['pause','暂停'],connecting:['pause','暂停'],paused:['restart','重新开始'],failed:['retry','重试'],cancelled:['retry','重新下载']})[j.state];
 $('#sheet').innerHTML=head+`<h2 id="dtitle">${j.name}</h2><p class="desc">${labels[j.state]} · ${copy[j.state]}</p><div class="facts"><div><span>模组类型</span><span>${j.kind}</span></div><div><span>已下载 / 总大小</span><span id="sheetBytes" class="num">${num(j.got)} / ${num(j.size)} MB</span></div></div><div id="graph">${graph(j)}</div><div class="actions">${!historyTask(j)?button('ask',j.id,'取消任务','pill danger'):''}${act?button(act[0],j.id,act[1],'pill filled'):button('close','','完成','pill filled')}</div>`;
}
function show(p,id){opener=document.activeElement;panel=p;selected=id||'';sheet();$('#dialog').showModal()}
function close(){if($('#dialog').open)$('#dialog').close()}
$('#dialog').addEventListener('close',()=>{const match=opener?.dataset.id&&document.querySelector(`main:not([hidden]) [data-id="${opener.dataset.id}"]`);(opener?.isConnected?opener:match?.getClientRects().length?match:$('#nav')).focus({preventScroll:true})});
$('#dialog').addEventListener('click',e=>{if(e.target!==$('#dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right||e.clientY>r.bottom)close()});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,j=find(b.dataset.id);
 if(a==='info'||a==='appearance'){show(a,b.dataset.id);return}if(a==='close'){close();return}
 if(a==='market'||a==='center'){view=a;draw();scrollTo(0,0);$('#nav').focus();return}
 if(a==='theme'||a==='mode'){if(a==='theme')theme=b.dataset.val;else mode=b.dataset.val;paint();sheet();$(`[data-a="${a}"][data-val="${b.dataset.val}"]`).focus();return}
 if(a==='reset'){reset();close();sound('示例任务已重置');return}
 if(a==='ask'||a==='infoBack'){panel=a==='ask'?'confirm':'info';sheet();$('#sheet button').focus();return}
 if(a==='pause')j.state='paused';if(a==='restart')start(j);
 if(a==='retry'){jobs=jobs.filter(x=>x!==j);j.state='queued';j.got=0;j.series=[];jobs.push(j);next()}
 if(a==='first'){jobs=jobs.filter(x=>x!==j);jobs.splice(jobs.findIndex(x=>x.state==='queued'),0,j)}
 if(a==='cancel'){j.state='cancelled';next()}
 const wasModal=$('#dialog').open;close();draw();if(!wasModal){(a==='pause'||a==='restart'?$('#current .filled'):document.querySelector(`#center [data-id="${j.id}"]`))?.focus({preventScroll:true})}
 sound(a==='first'?`${j.name} 已移到队首`:`${j.name}：${labels[j.state]}`);
});
setInterval(()=>{const j=current();if(!j||j.state==='paused'||document.hidden)return;const prev=j.state;if(prev==='connecting')j.state='active';
 const [inRate,outRate]=sample(j.tick++),n=Math.min(j.size-j.got,inRate);j.got+=n;const d=Math.min(j.got-j.written,outRate);j.written+=d;j.peak=Math.max(j.peak,n);
 j.series.push(n);j.diskSeries.push(d);if(j.series.length>36){j.series.shift();j.diskSeries.shift()}
 if(j.written>=j.size-1e-6){j.got=j.written=j.size;j.state='done';next();draw();sound(`${j.name} 已完成`);if($('#dialog').open&&selected===j.id&&panel==='confirm')panel='info'}else if(prev==='connecting')feature();else updateProgress();
 if($('#dialog').open&&panel==='info'&&selected===j.id){if(j.state!==prev)sheet();else{$('#sheetBytes').textContent=`${num(j.got)} / ${num(j.size)} MB`;$('#graph').innerHTML=graph(j)}}
},1000);
paint();reset();
</script></body></html>
