services:
  online-service:
    image: ghcr.io/modinmobilests/slaytheamethyst-online-service:latest
    container_name: sts-online-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      PUBLIC_BASE_URL: http://localhost:3001
      PRESENCE_DB_PATH: /app/data/presence.sqlite
      PRESENCE_HEARTBEAT_INTERVAL_SECONDS: 30
      PRESENCE_OFFLINE_TIMEOUT_SECONDS: 90
      QQ_GROUP_NUMBER: 1029305387
      PRESENCE_PANEL_TOKEN: change-me
      EASYTIER_ENABLED: "false"
      EASYTIER_CONFIG_SERVER_SCHEME: udp
      EASYTIER_CONFIG_SERVER_PORT: 22020
      EASYTIER_ENTRY_NODE_SCHEME: tcp
      EASYTIER_ENTRY_NODE_PORT: 11010
      LOG_LEVEL: info
    volumes:
      - online-service-data:/app/data

volumes:
  online-service-data:
